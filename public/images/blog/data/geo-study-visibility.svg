<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0b1020"/><text x="70" y="80" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">GEO 研究中的相对可见度提升</text><text x="70" y="122" fill="#9ca3af" font-family="Arial,sans-serif" font-size="21">GEO-bench 实验结果范围；不是生产环境排名保证</text><g font-family="Arial,sans-serif"><text x="80" y="215" fill="#e5e7eb" font-size="22">引用 / 统计 / 权威引语</text><rect x="380" y="175" width="560" height="65" rx="12" fill="#3b82f6"/><text x="960" y="218" fill="#fff" font-size="28" font-weight="700">30–40%</text><text x="80" y="335" fill="#e5e7eb" font-size="22">主观印象指标</text><rect x="380" y="295" width="385" height="65" rx="12" fill="#10b981"/><text x="785" y="338" fill="#fff" font-size="28" font-weight="700">15–30%</text><text x="80" y="455" fill="#e5e7eb" font-size="22">流畅 / 易读优化</text><rect x="380" y="415" width="385" height="65" rx="12" fill="#8b5cf6"/><text x="785" y="458" fill="#fff" font-size="28" font-weight="700">15–30%</text></g><text x="70" y="555" fill="#fbbf24" font-family="Arial,sans-serif" font-size="20">边界：原实验在固定上下文与特定生成式引擎中进行，不能证明自然抓取、持续引用或流量增长。</text><text x="70" y="615" fill="#64748b" font-family="Arial,sans-serif" font-size="17">来源：Aggarwal et al., GEO: Generative Engine Optimization, KDD 2024｜制图：Meridian</text></svg>
