<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0b1020"/><text x="70" y="80" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">SEO 交付风险矩阵</text><text x="70" y="122" fill="#9ca3af" font-family="Arial,sans-serif" font-size="21">依据 Google Search spam policies 的行为分类整理</text><g font-family="Arial,sans-serif"><text x="80" y="200" fill="#94a3b8" font-size="18">长期风险</text><line x1="155" y1="520" x2="1100" y2="520" stroke="#475569" stroke-width="2"/><line x1="155" y1="520" x2="155" y2="165" stroke="#475569" stroke-width="2"/><text x="880" y="560" fill="#94a3b8" font-size="18">短期报表增幅</text><circle cx="880" cy="235" r="82" fill="#ef4444" fill-opacity=".85"/><text x="880" y="228" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">规模化低价值内容</text><text x="880" y="255" text-anchor="middle" fill="#fff" font-size="17">Scaled content abuse</text><circle cx="700" cy="300" r="68" fill="#f97316" fill-opacity=".85"/><text x="700" y="295" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">垃圾外链</text><text x="700" y="322" text-anchor="middle" fill="#fff" font-size="16">Link spam</text><circle cx="520" cy="350" r="72" fill="#f59e0b" fill-opacity=".85"/><text x="520" y="345" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">站点声誉滥用</text><text x="520" y="372" text-anchor="middle" fill="#fff" font-size="16">Site reputation abuse</text><circle cx="315" cy="445" r="68" fill="#10b981" fill-opacity=".8"/><text x="315" y="440" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">用户价值内容</text><text x="315" y="467" text-anchor="middle" fill="#fff" font-size="16">People-first</text></g><text x="70" y="610" fill="#64748b" font-family="Arial,sans-serif" font-size="17">注：位置为 Meridian 风险评估框架，不是 Google 公布的惩罚概率。来源复核：2026-08-25。</text></svg>
